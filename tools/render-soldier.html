<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#888}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<textarea id="out" style="display:none"></textarea>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildSoldier } from '../public/js/soldier.js';
const N = Number(new URLSearchParams(location.search).get('n') || 16);
const S = 640;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setClearColor(0x000000, 0); r.toneMapping = THREE.ACESFilmicToneMapping;
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
scene.add(new THREE.HemisphereLight(0xffe7c2, 0x3a3020, 1.1));
const key = new THREE.DirectionalLight(0xfff0dc, 1.7); key.position.set(2, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffb35a, 3.2); rim.position.set(-3, 2.5, -4); scene.add(rim); // contraluz
const s = buildSoldier();
scene.add(s.root);
const cam = new THREE.OrthographicCamera(-1.0, 1.15, 2.07, -0.08, 0.1, 20);
cam.position.set(0, 0, 6); cam.lookAt(0, 0, 0); // límites de la cámara = coordenadas del mundo
const frames = [];
for (let i = 0; i < N; i++) {
  s.update(i / N);
  r.render(scene, cam);
  frames.push(r.domElement.toDataURL('image/png'));
}
document.getElementById('out').value = JSON.stringify(frames);
document.body.dataset.done = '1';
</script></body></html>
